<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Lên Chùa Cầu An</title>
<style>
:root{--gold:#f3c969;--cream:#fff4dc;--red:#b3261e;--glass:rgba(34,20,14,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0f0a;color:var(--cream);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(-6px,3px)}30%{transform:translate(5px,-4px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(3px,3px)}80%{transform:translate(-2px,1px)}}
.hud{position:fixed;z-index:5;pointer-events:none;opacity:0;transition:opacity .6s}
body.playing .hud{opacity:1}
#counter{top:max(10px,env(safe-area-inset-top));left:12px;background:var(--glass);border:1px solid rgba(243,201,105,.35);padding:7px 12px;border-radius:14px;font-size:13px;max-width:calc(100vw - 190px);line-height:1.35}
#counter b{color:var(--gold);font-variant-numeric:tabular-nums}
#tools{top:max(10px,env(safe-area-inset-top));right:12px;display:flex;gap:8px}
body.playing #tools{pointer-events:auto}
.tb{background:var(--glass);border:1px solid rgba(243,201,105,.4);border-radius:14px;padding:8px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.tb:active{transform:scale(.95)}
@media(max-width:560px){.tb .lbl{display:none}.tb{padding:9px 12px;font-size:16px}}
#act{position:fixed;z-index:6;right:max(18px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));min-width:150px;max-width:55vw;padding:18px 22px;border-radius:999px;border:2px solid var(--gold);background:linear-gradient(#d9402f,#a5251b);color:#fff;font-size:18px;font-weight:700;box-shadow:0 0 24px rgba(255,170,60,.6),0 6px 14px rgba(0,0,0,.45);display:none;cursor:pointer;animation:pulse 1.6s infinite}
#act.on{display:block}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(255,200,90,.95),0 6px 14px rgba(0,0,0,.45)}}
#joy{position:fixed;z-index:6;left:max(22px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,244,220,.12);border:2px solid rgba(243,201,105,.5);display:none;touch-action:none}
body.playing.touch #joy{display:block}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(243,201,105,.85);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#keys{left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;opacity:.75;background:var(--glass);padding:5px 12px;border-radius:10px;display:none}
body.playing:not(.touch) #keys{display:block}
#bubbles{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;background:rgba(255,248,230,.95);color:#4a2418;font-size:12.5px;padding:5px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);display:none;will-change:transform}
.bub:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:rgba(255,248,230,.95)}
#toast{position:fixed;z-index:30;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 54px));transform:translate(-50%,-20px);background:var(--glass);border:1px solid rgba(243,201,105,.5);padding:10px 16px;border-radius:14px;font-size:14px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.35s}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* Màn chào */
#splash{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 100%,rgba(255,150,70,.25),rgba(20,10,8,.55) 70%);transition:opacity .8s}
#splash.off{opacity:0;pointer-events:none}
.sp{text-align:center;max-width:380px;width:100%}
.sp h1{font-size:34px;margin:0 0 4px;color:var(--gold);letter-spacing:.5px;text-shadow:0 2px 14px rgba(255,140,40,.6)}
.sp .sub{opacity:.85;margin:0 0 22px;font-size:15px}
.sp input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(243,201,105,.6);background:rgba(20,10,6,.7);color:var(--cream);font-size:17px;text-align:center;outline:none;margin-bottom:12px;user-select:text;-webkit-user-select:text}
.big{display:block;width:100%;padding:15px;border-radius:16px;border:2px solid var(--gold);background:linear-gradient(#d9402f,#a5251b);color:#fff;font-size:19px;font-weight:700;cursor:pointer;margin-top:8px}
.big:disabled{opacity:.55}
.big:active{transform:scale(.98)}
.ghost{background:none;border:0;color:var(--cream);opacity:.8;text-decoration:underline;margin-top:10px;font-size:14px;cursor:pointer;padding:8px}
.note{font-size:12px;opacity:.65;margin-top:16px;line-height:1.5}
/* Hộp thoại */
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(10,5,3,.55)}
#sheet.on{display:flex}
#card{background:linear-gradient(#3a2218,#2b170f);border:1px solid rgba(243,201,105,.55);border-radius:20px;padding:18px 18px 14px;width:100%;max-width:430px;max-height:92dvh;overflow:auto;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:pan-y}
#card h2{margin:0 0 6px;color:var(--gold);font-size:22px}
#card p{margin:6px 0 10px;font-size:14.5px;line-height:1.5}
.hint{opacity:.85}
.row{display:flex;gap:10px}
.row .big{margin-top:6px}
.mgc{width:min(78vw,320px);height:min(78vw,320px);display:block;margin:6px auto;touch-action:none;background:radial-gradient(circle,rgba(255,200,100,.12),transparent 70%);border-radius:50%}
.msg{min-height:28px;font-size:17px;color:var(--gold);margin:2px 0 6px}
.bar{height:6px;background:rgba(255,244,220,.15);border-radius:3px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid rgba(243,201,105,.6);background:rgba(20,10,6,.7);color:var(--cream);font:inherit;font-size:16px;padding:10px;resize:none;outline:none;user-select:text;-webkit-user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chip{border:1px solid rgba(243,201,105,.5);background:rgba(255,244,220,.08);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.opt{display:flex;gap:8px;margin:8px 0}
.opt label{flex:1;border:1px solid rgba(243,201,105,.45);border-radius:12px;padding:9px 6px;font-size:14px;cursor:pointer}
.opt input{display:none}
.opt input:checked+span{color:var(--gold);font-weight:700}
.opt label:has(input:checked){background:rgba(243,201,105,.16);border-color:var(--gold)}
.cnt{text-align:right;font-size:12px;opacity:.7}
.err{color:#ff9a8a;font-size:13px;min-height:18px}
.ong{width:90px;height:150px;margin:6px auto;position:relative;transform-origin:50% 90%}
.ong .tube{position:absolute;bottom:0;left:10px;width:70px;height:100px;border-radius:10px 10px 18px 18px;background:linear-gradient(90deg,#8a5a24,#c9944a 40%,#8a5a24);border:2px solid #5a3612}
.ong .tube:after{content:"";position:absolute;inset:34px 12px auto;height:22px;background:#b3261e;border-radius:4px}
.ong s{position:absolute;bottom:96px;width:7px;height:56px;background:#f0dba8;border-radius:3px;border:1px solid #a98b4d}
.shaking{animation:rattle .18s infinite}
@keyframes rattle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.fall{animation:fall 1.1s ease-in forwards}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(0) rotate(0)}}
.que{background:#f6e6b8;color:#5a1f12;border:2px solid #a8261c;border-radius:12px;padding:14px;margin:8px 0;animation:fall .8s}
.que b{display:block;font-size:20px;color:#a8261c;margin-bottom:6px}
.que small{display:block;margin-top:8px;opacity:.7;font-size:12px}
.jl{text-align:left;font-size:14px;line-height:1.45}
.jl h3{color:var(--gold);margin:12px 0 4px;font-size:15px}
.jl .it{padding:6px 8px;background:rgba(255,244,220,.07);border-radius:8px;margin:4px 0}
.jl .it small{opacity:.6;display:block;font-size:11.5px}
#prev{width:100%;max-height:52dvh;object-fit:contain;border-radius:10px;border:1px solid rgba(243,201,105,.5)}
/* Hướng dẫn */
#tut{position:fixed;z-index:25;left:50%;bottom:max(180px,calc(env(safe-area-inset-bottom) + 170px));transform:translateX(-50%);width:min(90vw,380px);background:var(--glass);border:1px solid var(--gold);border-radius:16px;padding:14px;text-align:center;display:none}
#tut.on{display:block}
#tut p{margin:0 0 10px;font-size:15px;line-height:1.5}
#tut .row{justify-content:center}
#tut button{padding:8px 16px;border-radius:12px;border:1px solid var(--gold);background:rgba(243,201,105,.18);cursor:pointer}
</style>

<body>
<canvas id="gl"></canvas>
<div id="bubbles"></div>
<div class="hud" id="counter">Hôm nay có <b id="cnum">0</b> người lên chùa cầu an</div>
<div class="hud" id="tools">
  <button class="tb" id="bJournal" title="Sổ cầu an">📖<span class="lbl"> Sổ</span></button>
  <button class="tb" id="bShare" title="Chia sẻ">📤<span class="lbl"> Chia sẻ</span></button>
  <button class="tb" id="bMute">🔊</button>
</div>
<div class="hud" id="keys">WASD / phím mũi tên: đi · Kéo chuột: xoay · E / Space: hành động</div>
<div id="joy"><div id="knob"></div></div>
<button id="act">Hành động</button>
<div id="toast"></div>
<div id="tut"><p id="tutp"></p><div class="row"><button id="tutNext">Tiếp</button><button id="tutSkip">Bỏ qua</button></div></div>
<div id="sheet"><div id="card"></div></div>
<div id="splash"><div class="sp">
  <h1>Lên Chùa Cầu An</h1>
  <p class="sub">Một buổi chiều yên bình ở ngôi chùa nhỏ</p>
  <input id="nameIn" maxlength="16" placeholder="Tên của bạn" autocomplete="off">
  <button class="big" id="enter" disabled>Đang dựng chùa…</button>
  <p class="note">Không đăng nhập · Không thu thập dữ liệu · Không quảng cáo.<br>Trò chơi mang tính giải trí, thư giãn. Bật loa để nghe tiếng chuông, tiếng gió.</p>
</div></div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   0. TIỆN ÍCH CHUNG
   ===================================================================== */
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const angLerp=(a,b,t)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G={started:false,busy:false,t:0,tod:0,yaw:0,pitch:0.4,dist:8.5,shake:0,names:[],count:0};
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
if(isTouch)document.body.classList.add('touch');

/* =====================================================================
   1. LƯU TRÊN MÁY (localStorage)
   ===================================================================== */
const KEY='lencauan_v1';
const save={name:'',incense:0,best:0,prayers:[],fortunes:[],tut:false};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
let toastT=0;
function toast(msg,ms=2800){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}

/* Lọc từ thô tục: chuẩn hoá bỏ dấu rồi so khớp theo từ/cụm từ */
const BAD=['dit','dit me','dmm','dcm','dm','vcl','vkl','du ma','du me','dume','dumay','con cac','concac','oc cho','do cho','chet di','chet me','khon nan','mat day','thang dien','con dien','cut di','lua dao'];
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function isRude(s){const n=' '+norm(s)+' ';return BAD.some(w=>n.includes(' '+w+' '))}

/* =====================================================================
   2. ÂM THANH (Web Audio – mọi tiếng đều tổng hợp bằng code)
   ===================================================================== */
let AC=null,master,ambBus,sfxBus,noiseBuf,muted=false;
function initAudio(){
  if(AC){AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=muted?0:0.9;master.connect(AC.destination);
  ambBus=AC.createGain();ambBus.gain.value=0.6;ambBus.connect(master);
  sfxBus=AC.createGain();sfxBus.gain.value=0.9;sfxBus.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startAmbience();
}
function setMuted(m){muted=m;if(master)master.gain.setTargetAtTime(m?0:0.9,AC.currentTime,0.05);$('#bMute').textContent=m?'🔇':'🔊'}
function noiseSrc(){const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;return s}
function startAmbience(){
  // gió
  const w=noiseSrc(),wf=AC.createBiquadFilter(),wg=AC.createGain();wf.type='bandpass';wf.frequency.value=380;wf.Q.value=0.5;wg.gain.value=0.10;
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=0.09;lg.gain.value=0.06;l.connect(lg);lg.connect(wg.gain);l.start();
  w.connect(wf);wf.connect(wg);wg.connect(ambBus);w.start();
  // lá xào xạc
  const r=noiseSrc(),rf=AC.createBiquadFilter(),rg=AC.createGain();rf.type='highpass';rf.frequency.value=3500;rg.gain.value=0.012;
  const l2=AC.createOscillator(),lg2=AC.createGain();l2.frequency.value=0.23;lg2.gain.value=0.012;l2.connect(lg2);lg2.connect(rg.gain);l2.start();
  r.connect(rf);rf.connect(rg);rg.connect(ambBus);r.start();
  // tụng kinh rì rầm xa xa
  const o1=AC.createOscillator(),o2=AC.createOscillator(),f1=AC.createBiquadFilter(),f2=AC.createBiquadFilter(),cg=AC.createGain(),lp=AC.createBiquadFilter();
  o1.type=o2.type='sawtooth';o1.frequency.value=110;o2.frequency.value=165;
  f1.type='bandpass';f1.frequency.value=600;f1.Q.value=5;f2.type='bandpass';f2.frequency.value=1100;f2.Q.value=6;
  lp.type='lowpass';lp.frequency.value=1300;cg.gain.value=0;
  o1.connect(f1);o2.connect(f1);o1.connect(f2);f1.connect(lp);f2.connect(lp);lp.connect(cg);cg.connect(ambBus);o1.start();o2.start();
  (function chant(){
    if(!AC)return;let tt=AC.currentTime+0.05;const n=5+((Math.random()*5)|0);const notes=[110,123.5,98,130.8,110];
    for(let i=0;i<n;i++){const f=pick(notes);o1.frequency.setTargetAtTime(f,tt,0.06);o2.frequency.setTargetAtTime(f*1.5,tt,0.06);
      f1.frequency.setTargetAtTime(pick([500,650,800]),tt,0.08);cg.gain.setTargetAtTime(0.06,tt,0.07);cg.gain.setTargetAtTime(0.015,tt+0.34,0.09);tt+=0.52}
    cg.gain.setTargetAtTime(0,tt,0.3);
    setTimeout(chant,(tt-AC.currentTime)*1000+rand(1200,5000));
  })();
  // chim hót (ít dần về đêm) + dế đêm
  (function bird(){
    const lvl=1-G.tod*0.9;
    if(lvl>0.12&&AC){const t=AC.currentTime,n=2+((Math.random()*4)|0),base=rand(2200,3600);
      for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain(),t0=t+i*0.12;o.type='sine';
        o.frequency.setValueAtTime(base,t0);o.frequency.exponentialRampToValueAtTime(base*rand(1.2,1.6),t0+0.07);
        g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(0.045*lvl,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.1);
        o.connect(g);g.connect(ambBus);o.start(t0);o.stop(t0+0.12)}}
    setTimeout(bird,rand(1800,6500));
  })();
  (function cricket(){
    if(G.tod>0.45&&AC){const t=AC.currentTime;for(let i=0;i<3;i++){const o=AC.createOscillator(),g=AC.createGain(),t0=t+i*0.09;o.type='triangle';o.frequency.value=4300;
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(0.012*G.tod,t0+0.02);g.gain.linearRampToValueAtTime(0,t0+0.07);o.connect(g);g.connect(ambBus);o.start(t0);o.stop(t0+0.08)}}
    setTimeout(cricket,rand(700,1800));
  })();
  // tiếng chuông xa xa
  (function far(){setTimeout(()=>{sfx.bell(0.1,5,true);far()},rand(40000,70000))})();
}
const sfx={
  bell(vol=0.5,dur=6,far=false){
    if(!AC)return;const t=AC.currentTime;const base=far?174:196;
    [[1,1],[2.0,.55],[2.76,.4],[4.07,.22],[5.4,.12],[1.003,.7]].forEach(([m,a],i)=>{
      const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=base*m;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*a*0.5,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur/(1+i*0.35));
      if(far){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;o.connect(lp);lp.connect(g)}else o.connect(g);
      g.connect(far?ambBus:sfxBus);o.start(t);o.stop(t+dur+0.1)});
  },
  mo(vol=0.5){
    if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
    o.frequency.setValueAtTime(820,t);o.frequency.exponentialRampToValueAtTime(380,t+0.07);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+0.2);
    const n=noiseSrc(),f=AC.createBiquadFilter(),ng=AC.createGain();f.type='bandpass';f.frequency.value=1500;f.Q.value=1.2;
    ng.gain.setValueAtTime(vol*0.5,t);ng.gain.exponentialRampToValueAtTime(0.0001,t+0.05);n.connect(f);f.connect(ng);ng.connect(sfxBus);n.start(t);n.stop(t+0.08);
  },
  tick(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=330;g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+0.1)},
  ting(){if(!AC)return;const t=AC.currentTime;[1320,1980].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.12/(i+1),t);g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+1.7)})},
  rattle(){if(!AC)return;const t=AC.currentTime,n=noiseSrc(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=rand(2200,3600);f.Q.value=2;
    g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);n.connect(f);f.connect(g);g.connect(sfxBus);n.start(t);n.stop(t+0.12)},

function hit(p,r,c){
  if(c.t==='c'){const dx=p.x-c.x,dz=p.z-c.z,rr=c.r+r,d2=dx*dx+dz*dz;if(d2<rr*rr){const d=Math.sqrt(d2)||1e-4;p.x=c.x+dx/d*rr;p.z=c.z+dz/d*rr;return true}}
  else{const x0=c.x0-r,x1=c.x1+r,z0=c.z0-r,z1=c.z1+r;
    if(p.x>x0&&p.x<x1&&p.z>z0&&p.z<z1){const l=p.x-x0,rt=x1-p.x,t=p.z-z0,b=z1-p.z,m=Math.min(l,rt,t,b);
      if(m===l)p.x=x0;else if(m===rt)p.x=x1;else if(m===t)p.z=z0;else p.z=z1;return true}}
  return false;
}

function slab(parent,w,p0,p1,color,th=0.28,cz=0,cy=0,mirror=false){

  m.rotation.x=-Math.atan2(dy,dz);return m}
function curvedRoof(parent,{w,half,ridge,mid,eave,tip,cx=0,cy=0,cz=0,color=0xa63a2a}){

  })();
}

function actMo(){

  openSheet(`<h2>🪘 Gõ mõ tụng kinh</h2><p class="hint">Chạm vào mõ khi vòng sáng khớp vòng vàng. Khoảng 30 giây, cứ thong thả theo nhịp.</p><canvas id="mgc" class="mgc"></canvas><div class="bar"><i id="pb"></i></div><div class="msg" id="msg">Hít thở sâu… chuẩn bị</div><button class="big" id="tap">Gõ</button><button class="ghost" id="x">Thôi</button>`,()=>{alive=false});
  const g=setupRingCanvas(),msg=$('#msg'),pb=$('#pb');
  const N=34,PER=0.8,T0=2.6;
  let beats,strays,t0,over,flash;
  function init(){beats=[...Array(N)].map((_,i)=>({t:T0+i*PER,res:null,ticked:false}));strays=0;t0=performance.now()/1000;over=false;flash={txt:'',t:-9,col:'#fff'};msg.textContent='Hít thở sâu… chuẩn bị'}
  init();

  function tap(){
    initAudio();if(over)return;const n=performance.now()/1000-t0;sfx.mo(0.45);moHit=1;
    let bi=-1,bd=9;beats.forEach((b,i)=>{if(!b.res){const d=Math.abs(b.t-n);if(d<bd){bd=d;bi=i}}});
    if(bi>=0&&bd<0.42){const b=beats[bi];if(bd<0.12){b.res='perfect';say('Tĩnh tâm','#8fe3a8')}else if(bd<0.25){b.res='good';say('Được','#f3c969')}else{b.res='off';say('Lệch nhịp','#ff9a8a')}}

  const keyh=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tap()}};document.addEventListener('keydown',keyh);sheetClose=()=>{alive=false;document.removeEventListener('keydown',keyh)};

function openJournal(){
  const pr=save.prayers.slice().reverse().slice(0,30),fo=save.fortunes.slice().reverse().slice(0,30);
  openSheet(`<h2>📖 Sổ cầu an của tôi</h2><div class="jl"><div class="it">Tên: <b>${esc(save.name||'Khách')}</b><br>Số nén hương đã thắp: <b>${save.incense}</b><br>Tâm an cao nhất: <b>${save.best}/100</b></div>
  <h3>Lời cầu đã viết (${save.prayers.length})</h3>${pr.length?pr.map(p=>`<div class="it">${esc(p.text)}<small>${p.kind==='ribbon'?'Dải lụa đỏ':'Đèn hoa đăng'} · ${fmt(p.ts)}</small></div>`).join(''):'<div class="it">Chưa có lời cầu nào.</div>'}
  <h3>Quẻ đã xin (${save.fortunes.length}) <small>· giải trí</small></h3>${fo.length?fo.map(p=>`<div class="it"><b>Quẻ ${p.n}.</b> ${esc(p.text)}<small>${fmt(p.ts)}</small></div>`).join(''):'<div class="it">Chưa xin quẻ nào.</div>'}</div>
  <button class="big" id="x">Đóng</button><button class="ghost" id="wipe">Xoá sổ trên máy này</button>`);
  $('#x').onclick=closeSheet;
  $('#wipe').onclick=()=>{if(confirm('Xoá toàn bộ sổ cầu an trên máy này?')){save.incense=0;save.best=0;save.prayers=[];save.fortunes=[];persist();closeSheet();toast('Đã xoá sổ.')}};
}

/* =====================================================================
   12. CHIA SẺ: vẽ ảnh dọc 1080×1350 bằng canvas
   ===================================================================== */
async function makeShareImage(){
  const W=1080,H=1350,out=document.createElement('canvas');out.width=W;out.height=H;const g=out.getContext('2d');
  // render cảnh với khung 4:5 rồi chép sang canvas ngay trong cùng một nhịp
  const ow=renderer.domElement.width,oh=renderer.domElement.height,opr=renderer.getPixelRatio();
  renderer.setPixelRatio(1);renderer.setSize(W,H,false);camera.aspect=W/H;camera.fov=62;camera.updateProjectionMatrix();pointScale.value=H/(2*Math.tan(camera.fov*Math.PI/360));
  renderer.render(scene,camera);g.drawImage(renderer.domElement,0,0,W,H);
  renderer.setPixelRatio(opr);resize();
  const grd=g.createLinearGradient(0,H*0.5,0,H);grd.addColorStop(0,'rgba(20,8,4,0)');grd.addColorStop(1,'rgba(20,8,4,.88)');g.fillStyle=grd;g.fillRect(0,H*0.5,W,H*0.5);
  const tg=g.createLinearGradient(0,0,0,220);tg.addColorStop(0,'rgba(20,8,4,.65)');tg.addColorStop(1,'rgba(20,8,4,0)');g.fillStyle=tg;g.fillRect(0,0,W,220);
  const font='"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif';
  g.textAlign='center';g.fillStyle='#f3c969';g.font=`bold 58px ${font}`;g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=12;g.fillText('Chùa An Lạc',W/2,110);g.shadowBlur=0;
  const pr=save.prayers[save.prayers.length-1];
  const name=save.name||'Khách';
  g.fillStyle='#fff4dc';g.font=`600 46px ${font}`;g.fillText(name,W/2,H-440);
  g.fillStyle='#fff4dc';g.font=`italic 44px ${font}`;
  const text=pr?`“${pr.text}”`:'Một buổi chiều yên bình ở chùa.';
  const ls=wrapLines(g,text,W-200).slice(0,6);ls.forEach((l,i)=>g.fillText(l,W/2,H-370+i*60));
  if(save.best>0||true){const by=H-110;g.fillStyle='rgba(243,201,105,.18)';g.beginPath();g.roundRect(W/2-230,by-62,460,84,42);g.fill();g.strokeStyle='#f3c969';g.lineWidth=3;g.stroke();
    g.fillStyle='#f3c969';g.font=`bold 44px ${font}`;g.fillText(`Tâm an: ${save.best}/100`,W/2,by-5)}
  g.fillStyle='rgba(255,244,220,.85)';g.font=`500 32px ${font}`;g.fillText('Lên Chùa Cầu An',W/2,H-28);
  return out;
}
async function openShare(){
  initAudio();
  const cvs=await makeShareImage();
  const blob=await new Promise(r=>cvs.toBlob(r,'image/png'));
  const url=URL.createObjectURL(blob);cvs.width=cvs.height=0;
  const file=new File([blob],'len-chua-cau-an.png',{type:'image/png'});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  openSheet(`<h2>📤 Chia sẻ</h2><img id="prev" src="${url}" alt="Ảnh chia sẻ"><button class="big" id="go">${canShare?'Chia sẻ ảnh':'Tải ảnh xuống'}</button><button class="ghost" id="x">Đóng</button>`,()=>{URL.revokeObjectURL(url)});
  $('#x').onclick=closeSheet;
  $('#go').onclick=async()=>{
    if(canShare){try{await navigator.share({files:[file],title:'Lên Chùa Cầu An',text:'Một buổi chiều yên bình ở chùa 🙏'});return}catch(e){if(e&&e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=url;a.download='len-chua-cau-an.png';document.body.appendChild(a);a.click();a.remove();toast('Đã tải ảnh xuống.');
  };
}

/* =====================================================================
   13. MÀN CHÀO, HƯỚNG DẪN, KHỞI ĐỘNG
   ===================================================================== */
const nameIn=$('#nameIn');nameIn.value=save.name||'';
const enter=$('#enter');
function ready(){enter.disabled=false;enter.textContent='Vào chùa'}
function startGame(){
  let name=nameIn.value.trim().slice(0,16)||'Khách';
  if(isRude(name)){nameIn.value='';nameIn.placeholder='Bạn hãy chọn tên khác nhé';return}
  save.name=name;persist();initAudio();
  makeNameSprite(name);
  $('#splash').classList.add('off');document.body.classList.add('playing');G.started=true;G.yaw=0;G.pitch=0.38;G.dist=8.5;camT.set(P.x,1.4,P.z);
  setMuted(muted);
  // khôi phục vài lời cầu gần nhất lên cảnh
  const lastR=save.prayers.filter(p=>p.kind==='ribbon').slice(-3),lastL=save.prayers.filter(p=>p.kind==='lantern').slice(-3);
  lastR.forEach(p=>addPlayerRibbon(p.text));lastL.forEach(()=>addPlayerLantern());
  setTimeout(()=>$('#splash').style.display='none',900);
  if(!save.tut)startTutorial();
}
enter.addEventListener('click',startGame);nameIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&!enter.disabled)startGame()});
$('#bMute').onclick=()=>{initAudio();setMuted(!muted)};
$('#bJournal').onclick=()=>{if(!G.busy)openJournal()};
$('#bShare').onclick=()=>{if(!G.busy)openShare()};
const TUT=[isTouch?'Bước 1 · Dùng cần điều khiển ở góc trái để đi lại. Kéo ngón tay trên màn hình để xoay góc nhìn.':'Bước 1 · Dùng phím W A S D hoặc phím mũi tên để đi lại. Kéo chuột để xoay góc nhìn.','Bước 2 · Đi tới gần chỗ có vòng sáng vàng: lư hương, gác chuông, mõ, ống xăm, cây bồ đề.','Bước 3 · Khi nút hành động to màu đỏ hiện ra, chạm một lần để bắt đầu.'];
let tutI=0;
function startTutorial(){tutI=0;showTut();$('#tut').classList.add('on')}
function showTut(){$('#tutp').textContent=TUT[tutI];$('#tutNext').textContent=tutI===TUT.length-1?'Đã hiểu':'Tiếp'}
function endTut(){$('#tut').classList.remove('on');save.tut=true;persist()}
$('#tutNext').onclick=()=>{tutI++;if(tutI>=TUT.length)endTut();else showTut()};
$('#tutSkip').onclick=endTut;

requestAnimationFrame(t=>{last=t;frame(t)});
ready();
</script>
</body>
