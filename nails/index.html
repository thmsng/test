<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lacquer — Press-on Nails</title>
  <meta name="description" content="Eight press-on nail sets on a peg wall. Glide a finger over the boxes, click one to try it on a hand.">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="stage" aria-label="Eight press-on nail boxes hanging on a peg wall. Move over them with your finger; click one to try the nails on a hand."></canvas>

  <header class="bar">
    <a class="brand" href="#" aria-label="Lacquer home">lacquer</a>
    <nav>
      <a href="#">Shop</a>
      <a href="#">Journal</a>
      <a href="#" class="bag">Bag <span id="bag-count">0</span></a>
    </nav>
  </header>

  <p class="hint" id="hint">Glide a finger over the boxes &nbsp;·&nbsp; Click one to try it on</p>
  <div class="tag" id="tag" aria-hidden="true"></div>

  <section class="detail" id="detail" aria-hidden="true" aria-label="Try on">
    <button class="close" id="d-close" aria-label="Close">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
    </button>

    <div class="info">
      <p class="index" id="d-index">01 / 08</p>
      <h1 id="d-name">Milk Bath</h1>
      <p class="price"><span id="d-price">$18</span><span class="dot">·</span><span id="d-finish"></span></p>
      <p class="desc" id="d-desc"></p>
      <p class="label">Shape</p>
      <div class="shapes" id="shapes" role="group" aria-label="Nail shape"></div>
      <p class="label">Skin tone</p>
      <div class="skins" id="skins" role="group" aria-label="Skin tone"></div>
      <button class="cta" id="d-add">Add to bag</button>
    </div>

    <button class="nav prev" id="d-prev" aria-label="Previous set">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <button class="nav next" id="d-next" aria-label="Next set">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <p class="drag-note">Drag to turn the hand</p>
  </section>

  <div class="loader" aria-hidden="true">lacquer</div>
  <noscript><p class="nojs">This page needs JavaScript and WebGL to show the 3D shop.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
