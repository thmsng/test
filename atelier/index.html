<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atelier — Essential Tees</title>
  <meta name="description" content="Eight essential tees on a rail. Drag to swing them, click to see front and back.">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="stage" aria-label="Eight t-shirts hanging on a clothing rail. Drag to swing them; click one to see its front and back."></canvas>

  <header class="bar">
    <a class="brand" href="#" aria-label="Atelier home">atelier</a>
    <nav>
      <a href="#">Shop</a>
      <a href="#">Journal</a>
      <a href="#" class="bag">Bag <span id="bag-count">0</span></a>
    </nav>
  </header>

  <p class="hint" id="hint">Drag to swing &nbsp;·&nbsp; Click a tee to view</p>
  <div class="tag" id="tag" aria-hidden="true"></div>

  <section class="detail" id="detail" aria-hidden="true" aria-label="Product details">
    <button class="close" id="d-close" aria-label="Close">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
    </button>

    <div class="info">
      <p class="index" id="d-index">01 / 08</p>
      <h1 id="d-name">Everyday Tee</h1>
      <p class="price" id="d-price">$48</p>
      <p class="desc" id="d-desc"></p>
      <p class="meta"><i class="swatch" id="d-swatch"></i><span id="d-color">Ivory</span></p>
      <div class="sizes" role="group" aria-label="Size">
        <button class="size" data-size="XS">XS</button>
        <button class="size" data-size="S">S</button>
        <button class="size on" data-size="M">M</button>
        <button class="size" data-size="L">L</button>
        <button class="size" data-size="XL">XL</button>
      </div>
      <button class="cta" id="d-add">Add to bag</button>
    </div>

    <div class="views" role="group" aria-label="View">
      <button data-view="front" class="on" aria-pressed="true">Front</button>
      <button data-view="back" aria-pressed="false">Back</button>
    </div>

    <button class="nav prev" id="d-prev" aria-label="Previous tee">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <button class="nav next" id="d-next" aria-label="Next tee">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <p class="drag-note">Drag to turn</p>
  </section>

  <div class="loader" aria-hidden="true">atelier</div>

  <noscript><p class="nojs">This page needs JavaScript and WebGL to show the 3D rack.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
